name: sixam_mart
description: A Multi-vendor1 Food. Grocery, eCommerce, Pharmacy & Parcel service.
publish_to: "none" #
version: 3.10.3+209

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  shared_preferences: ^2.3.4
  connectivity_plus: ^6.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  firebase_auth: ^5.3.1
  path_provider: ^2.1.4
  pin_code_fields: ^8.0.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  timeago: ^3.7.0
  flutter_typeahead: ^4.3.7
  carousel_slider: ^5.0.0
  shimmer_animation: ^2.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_cache_manager: ^3.3.1
  pointer_interceptor: ^0.10.1+2
  phone_numbers_parser: ^9.0.0
  dartz: ^0.10.1
  country_code_picker: ^3.3.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  #  image_compression_flutter: ^1.0.4
  dotted_border: ^2.1.0
  flutter_iconly: ^1.0.2
  share_plus: ^10.0.2
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4
  sign_in_with_apple: ^6.1.3
  intl: ^0.19.0
  just_the_tooltip: ^0.0.12
  animated_flip_counter: ^0.3.4
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.2.0
  dropdown_button2: ^2.3.9
  encrypt: ^5.0.3
  crypto: ^3.0.3
  dio: ^5.9.0
  local_auth: ^2.1.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  # App Update Dependencies
  package_info_plus: ^8.0.0
  # in_app_update: ^4.2.3  # REMOVED - causes crashes

  file_picker: ^8.1.7

  permission_handler: ^11.0.1

  qr_flutter: ^4.1.0

  geocoding: ^3.0.0
  visibility_detector: ^0.4.0+2
  blurhash_dart: ^1.2.1
  logger: ^2.0.2

  device_info_plus: ^11.1.1
  flutter_secure_storage: ^9.2.2
  collection: ^1.19.1
  equatable: ^2.0.7
  dart_pusher_channels: ^1.3.1
dependency_overrides:
  collection: ^1.19.1
  web: ^1.1.0
  vector_math: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  mockito: ^5.4.4
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/image/
    - assets/language/
    - assets/map/
    - assets/json/
    - assets/certs/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal-Bold.ttf
          weight: 700
